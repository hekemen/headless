network:
  host: 0.0.0.0
  port: 8080
  disable_auth: true
  allowed_origins: []

model:
  model_dir: models
  #model_name: Qwen3.8-27B-EXL3
  #model_name: Swift-Qwen3.8-27B-SC-3.5bpw
  model_name: Swift-Qwen3.8-27B-SC-4.0bpw
  max_seq_len: 98304         # better exact-copy accuracy, earlier compaction
  #cache_size: 245760          # room for 3 sessions + keeping idle prefixes
  cache_size: 294912          # room for 3 sessions + keeping idle prefixes
  cache_mode: "6,4"
  max_batch_size: 3
  chunk_size: 2048            # faster prefill than 2048 if VRAM allows
  gpu_split_auto: true
  autosplit_reserve: [500, 0]
  tensor_parallel: true
  tensor_parallel_backend: native
  fasttensors: true
  vision: false

  reasoning: true
  tool_format: qwen3_coder
  template_vars_default:
    enable_thinking: true
    reasoning_effort: "low"

#draft_model:
#  draft_mode: mtp
#  draft_num_tokens: 3
#  draft_cache_mode: Q8

draft_model:
  draft_mode: mtp
  draft_num_tokens: 4
  draft_cache_mode: "4,4"      # Frees VRAM compared to Q8 without degradation
  dynamic_draft: true          # Truncates drafting when entropy spikes
  draft_confidence: 0.4
  hybrid_draft_tokens: 16      # Accelerates context-copying and code refactoring
  draft_max_rows: 12

sampling:
  override_preset: null
  temperature: { override: 1.0 }
  top_p:       { override: 0.95 }
  top_k:       { override: 0, force: true }   # 0 disables Top-K entirely
  min_p:       { override: 0.05, force: true }

logging:
  log_requests: false
  log_chat_completion_requests: false

developer:
  unsafe_launch: false           # Keep false: protects against silent VRAM overflows at startup
  disable_request_streaming: false
  cuda_malloc_backend: true      # Keep true: prevents VRAM fragmentation on tight 24 GB pools
  uvloop: true

memory:
  sysmem_recurrent_cache: 6144        # Safe bump from 4 GB -> 6 GB (~80 GDN checkpoints)
  sysmem_kv_cache: 8192               # Keep at 8 GB (already fits 3 active sessions in RAM)
  disk_cache_dir: /app/cache          # Ensure this is mounted to a fast host NVMe drive
  disk_cache_size: 153600             # 150 GiB on NVMe absorbs overflow without touching RAM
  disk_cache_flush_on_idle: true
  disk_cache_checkpoint_interval: 4096 # Keep at 4096 so checkpoints don't bloat the 6 GB RAM pool
  cuda_malloc_async: true
